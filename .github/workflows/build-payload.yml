name: build-nova-boot

on:
  push:
    branches: [Nova-boot]
  pull_request:
  workflow_dispatch:

jobs:
  payload:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc make python3 git ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch pinned hekate BDK
        run: |
          git clone --depth 1 --branch v6.5.5 https://github.com/CTCaer/hekate /opt/hekate

      - name: Host core tests
        run: make host-test

      - name: Build payload
        run: make -C payload HEKATE=/opt/hekate DEVKITPRO=/opt/devkitpro DEVKITARM=/opt/devkitpro/devkitARM

      - name: Verify payload format
        run: python3 tools/verify_payload.py payload/build/NOVA.bin payload/build/NOVA.elf

      - name: Render UI preview
        run: make -C tools preview

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-boot-payload
          path: |
            payload/build/NOVA.bin
            payload/build/NOVA.elf
            build/preview_full.png
